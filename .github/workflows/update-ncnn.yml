name: update-ncnn

# Daily: if Tencent/ncnn has a newer release than ncnn.version, build + test it
# and open a PR that updates ncnn.version to that tag. Merge it, then run the publish workflow.
on:
  schedule:
    - cron: '17 3 * * *'  # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v7

      - name: check for a new ncnn release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/Tencent/ncnn/releases/latest --jq .tag_name)
          current_commit=$(sed -n 's/^commit=//p' ncnn.version)
          # annotated tags list the tag object plus the commit under "^{}"; prefer the commit
          latest_commit=$(git ls-remote https://github.com/Tencent/ncnn.git "refs/tags/$latest" "refs/tags/$latest^{}" |
            awk -v r="refs/tags/$latest" '{ sha[$2] = $1 } END { print (r "^{}" in sha) ? sha[r "^{}"] : sha[r] }')
          echo "latest release: $latest ($latest_commit), pinned: $current_commit"
          if [ "$latest_commit" = "$current_commit" ]; then
            echo "up to date"
          elif gh pr list --repo "$GITHUB_REPOSITORY" --head "update-ncnn-$latest" --state all --json number --jq length | grep -qv '^0$'; then
            echo "a PR for $latest already exists"
          else
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
            echo "commit=$latest_commit" >> "$GITHUB_OUTPUT"
          fi

  # same build + test as a normal push, against the new tag
  build-test:
    needs: check
    if: needs.check.outputs.tag != ''
    uses: ./.github/workflows/build-test.yml
    with:
      ncnn_ref: ${{ needs.check.outputs.tag }}

  pr:
    needs: [check, build-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: open PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          COMMIT: ${{ needs.check.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'tag=%s\ncommit=%s\n' "$TAG" "$COMMIT" > ncnn.version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "update-ncnn-$TAG"
          git add ncnn.version
          git commit -m "Update ncnn to $TAG"
          git push origin "update-ncnn-$TAG"
          gh pr create --title "Update ncnn to $TAG" --body "$(printf '%s\n' \
            "New ncnn release: https://github.com/Tencent/ncnn/releases/tag/$TAG" \
            "" \
            "Build + smoke tests already passed for this tag: $RUN_URL" \
            "(PRs opened by GitHub Actions don't trigger CI on their own.)" \
            "" \
            "After merging, publish it: Actions → publish → Run workflow (creates $TAG.1).")"
